
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FPSC CSS Final Results</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 30px;
        }

        button {
            padding: 10px 20px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
        }

        .result-card {
            border: 1px solid #ddd;
            padding: 15px;
            margin-top: 12px;
            border-radius: 6px;
        }

        #status {
            margin-top: 15px;
        }
    </style>
</head>
<body>

    <h2>FPSC CSS Final Results</h2>

    <button id="fetchResults">Fetch Results</button>

    <div id="status"></div>
    <div id="results"></div>

    <script>
        
$(document).ready(function () {

    $("#fetchResults").click(function () {

        $("#status").html("Loading results...");
        $("#results").empty();

        $.ajax({
            url: "https://www.fpsc.gov.pk/api/results?category=CSS_FINAL_RESULT",
            type: "GET",
            dataType: "json",

            headers: {
                "Accept": "application/json",
                "Content-Type": "application/json",
                "X-Requested-With": "XMLHttpRequest"
            },

            success: function (response) {

                if (response.success && response.data.length > 0) {

                    $("#status").html(
                        "Total Records: " + response.count
                    );

                    $.each(response.data, function (index, record) {

                        let html = `
                            <div class="result-card">
                                <h3>Record ${index + 1}</h3>
                                <pre>${JSON.stringify(record, null, 2)}</pre>
                            </div>
                        `;

                        $("#results").append(html);
                    });

                } else {
                    $("#status").html("No records found.");
                }
            },

            error: function (xhr, status, error) {

                $("#status").html(
                    "Error fetching results: " + error
                );

                console.log("HTTP Status:", xhr.status);
                console.log("Response:", xhr.responseText);
            }
        });

    });

});
    </script>

</body>
</html>
